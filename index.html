<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#C17A5C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prepify">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Prepify · Synced Meal Prep</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #FEFAF3; color: #3D3A36; margin: 0; -webkit-tap-highlight-color: transparent; }
    .font-display { font-family: 'Playfair Display', Georgia, serif; }
    .card { background: #FFFBF5; border: 1px solid #E8E2D8; border-radius: 20px; box-shadow: 0 4px 18px rgba(61,58,54,0.04); transition: all 0.2s; }
    .card:hover { box-shadow: 0 10px 28px rgba(61,58,54,0.08); transform: translateY(-2px); }
    .tab-btn { padding: 0.5rem 1.25rem; border-radius: 40px; font-weight: 500; font-size: 0.9rem; background: transparent; color: #6B5F52; border: none; cursor: pointer; transition: all 0.2s; min-height: 44px; }
    .tab-btn.active { background: white; color: #C17A5C; box-shadow: 0 2px 12px rgba(0,0,0,0.04); font-weight: 600; }
    .badge { display: inline-flex; padding: 0.2rem 0.8rem; border-radius: 30px; font-size: 0.7rem; font-weight: 600; background: #F5F2ED; color: #5E5548; }
    .badge-pasta { background: #FDE8D0; color: #B8783B; }
    .badge-rice { background: #E0F0E4; color: #5C8A6B; }
    .badge-noodles { background: #FDE8E4; color: #C47A6B; }
    .badge-wrap { background: #E8E4F0; color: #6B5C8A; }
    .diff-easy { background: #E0F0E4; color: #5C8A6B; }
    .diff-medium { background: #FDF3E0; color: #C49A3B; }
    .shopping-item.checked .item-text { text-decoration: line-through; opacity: 0.5; }
    .shopping-item .check-dot { transition: all 0.2s; }
    .shopping-item.checked .check-dot { background: #8B9D6B !important; border-color: #8B9D6B !important; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(40,36,31,0.4); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal-content { background: white; border-radius: 24px; max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto; }

    @media (max-width: 768px) {
      .card { padding: 0.75rem; }
      .tab-btn { padding: 0.4rem 0.9rem; font-size: 0.8rem; }
      .week-grid { gap: 0.75rem; }
      .modal-content { margin: 0.5rem; border-radius: 20px; }
      h2.font-display { font-size: 1.5rem; }
      button, label, .tab-btn { min-height: 44px; }
    }

    /* Improved Browse Meals cards */
    .meal-card {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1.2rem;
      transition: all 0.2s ease;
    }
    .meal-card:hover {
      box-shadow: 0 12px 28px rgba(61,58,54,0.1);
      transform: translateY(-3px);
    }
    .meal-card .meal-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.82rem;
      color: #5E5548;
    }
    .meal-card .meal-meta .diff-badge {
      padding: 0.15rem 0.6rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .meal-card .add-btn {
      margin-top: auto;
      align-self: flex-start;
      font-weight: 600;
      font-size: 0.82rem;
      padding: 0.5rem 1.2rem;
      border-radius: 12px;
      background: #8B9D6B;
      color: white;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
    }
    .meal-card .add-btn:hover { background: #6d804f; }
  </style>
</head>
<body class="min-h-screen">
  <div id="app"></div>

  <script>
    // ⚙️ SET YOUR BACKEND URL
    const API_BASE = 'https://prepify-backend-pmbg.onrender.com';

    const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
    const FIVE_DAYS_MS = 5 * 24 * 60 * 60 * 1000;

    // ========== PANTRY SYSTEM ==========
    const PANTRY_KEY = 'prepify_pantry_v2';
    
    function getPantryStocked() {
      try { return JSON.parse(localStorage.getItem(PANTRY_KEY) || '{}'); }
      catch(e) { return {}; }
    }
    
    function markPantryItem(name) {
      const stocked = getPantryStocked();
      stocked[name.toLowerCase()] = Date.now();
      localStorage.setItem(PANTRY_KEY, JSON.stringify(stocked));
    }
    
    function unmarkPantryItem(name) {
      const stocked = getPantryStocked();
      delete stocked[name.toLowerCase()];
      localStorage.setItem(PANTRY_KEY, JSON.stringify(stocked));
    }
    
    function isPantryStocked(name) {
      const stocked = getPantryStocked();
      return !!stocked[name.toLowerCase()];
    }

    // ========== GLOBAL STATE ==========
    const store = {
      meals: [],
      ingredientsMap: {},
      methodsMap: {},
      selectedMeals: {},
      shoppingChecked: {},
      filters: { category:'', cuisine:'', difficulty:'', maxTime:'', search:'' },
      activeTab: 'planner',
      listeners: new Set(),
      subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
      emit() { this.listeners.forEach(fn => fn()); saveLocalData(); pushToServer(); pushDatabaseIfNeeded(); },
      setMeals(meals) { this.meals = meals; this.emit(); },
      setIngredientsMap(map) { this.ingredientsMap = map; },
      setMethodsMap(map) { this.methodsMap = map; },
      selectMeal(day, meal) { this.selectedMeals = { ...this.selectedMeals, [day]: meal }; this.emit(); },
      removeMeal(day) { const n = { ...this.selectedMeals }; delete n[day]; this.selectedMeals = n; this.emit(); },
      autoFillWeek() {
        if (!this.meals.length) return;
        const sel = {}; const used = new Set();
        const cats = ['Pasta','Rice Bowl','Noodles','Rice Bowl','Pasta'];
        DAYS.forEach((d,i) => {
          const pool = this.meals.filter(m => m.Category === cats[i] && !used.has(m.ID));
          const pick = pool.length ? pool[Math.floor(Math.random()*pool.length)] : this.meals.find(m => !used.has(m.ID));
          if (pick) { sel[d] = pick; used.add(pick.ID); }
        });
        this.selectedMeals = sel; this.emit();
      },
      clearWeek() { this.selectedMeals = {}; this.emit(); },
      toggleShoppingItem(key) {
        this.shoppingChecked = { ...this.shoppingChecked, [key]: !this.shoppingChecked[key] };
        if (this.shoppingChecked[key]) {
          const list = this.getRawShoppingItems();
          const item = list.find(i => (i.name?.toLowerCase().replace(/[^a-z0-9]/g,'_')) === key);
          if (item && isPantryCategory(item.name)) {
            markPantryItem(item.name);
          }
        }
        this.emit();
      },
      setFilters(f) { this.filters = { ...this.filters, ...f }; this.emit(); },
      resetFilters() { this.filters = { category:'', cuisine:'', difficulty:'', maxTime:'', search:'' }; this.emit(); },
      setActiveTab(tab) { this.activeTab = tab; this.emit(); },
      getFilteredMeals() {
        let res = [...this.meals]; const f = this.filters;
        if (f.category) res = res.filter(m => m.Category === f.category);
        if (f.cuisine) res = res.filter(m => m.Cuisine === f.cuisine);
        if (f.difficulty) res = res.filter(m => m.Difficulty === f.difficulty);
        if (f.maxTime) res = res.filter(m => (m['Prep Time (min)']+m['Cook Time (min)']) <= parseInt(f.maxTime));
        if (f.search) { const q = f.search.toLowerCase(); res = res.filter(m => m['Meal Name'].toLowerCase().includes(q) || m.Cuisine.toLowerCase().includes(q)); }
        return res;
      },
      getRawShoppingItems() {
        const items = [];
        DAYS.forEach(day => {
          const meal = this.selectedMeals[day]; if (!meal) return;
          const ingData = this.ingredientsMap[meal.ID];
          if (ingData && ingData.length) {
            ingData.forEach(i => items.push({ ...i, mealRef: meal['Meal Name'], category: categorizeIngredient(i.name) }));
          } else {
            const serv = meal.Servings || 4;
            (meal['Carb Source']||'').split(',').forEach(c => c && items.push({ name: c.trim(), quantity: 80*serv, unit: 'g', mealRef: meal['Meal Name'], category: 'Grains' }));
            (meal['Protein Source']||'').split(',').forEach(p => p && items.push({ name: p.trim(), quantity: 150*serv, unit: 'g', mealRef: meal['Meal Name'], category: 'Protein' }));
            (meal.Vegetables||'').split(',').forEach(v => v && items.push({ name: v.trim(), quantity: 50*serv, unit: 'g', mealRef: meal['Meal Name'], category: 'Produce' }));
          }
        });
        return items;
      },
      getShoppingList() {
        const items = this.getRawShoppingItems();
        const filteredItems = items.filter(item => {
          const cat = categorizeIngredient(item.name);
          if (cat === 'Produce' || cat === 'Protein' || cat === 'Grains & Pasta') return true;
          return !isPantryStocked(item.name);
        });
        const merged = {};
        filteredItems.forEach(i => {
          const key = i.name.toLowerCase().replace(/[^a-z0-9]/g,'_');
          if (merged[key]) { merged[key].quantity += i.quantity; if (!merged[key].mealRefs.includes(i.mealRef)) merged[key].mealRefs.push(i.mealRef); }
          else merged[key] = { ...i, key, mealRefs: [i.mealRef], quantity: i.quantity };
        });
        return Object.values(merged).sort((a,b) => a.category?.localeCompare(b.category||''));
      }
    };

    function categorizeIngredient(name) {
      const n = name.toLowerCase();
      if (/pasta|noodle|rice|quinoa|orzo|vermicelli|couscous|tortilla/.test(n)) return 'Grains & Pasta';
      if (/chicken|beef|pork|lamb|salmon|tuna|prawn|tofu|egg|chickpea|bean|lentil/.test(n)) return 'Protein';
      if (/broccoli|spinach|tomato|carrot|onion|garlic|cucumber|pepper|zucchini|lettuce|avocado|mango|lemon|lime/.test(n)) return 'Produce';
      if (/oil|sauce|vinegar|spice|herb|salt|pepper|cumin|paprika|oregano|thyme|basil|parsley|coriander|mint|dill|sage|rosemary|bay|stock|broth|paste|miso|gochujang|harissa|tahini|honey|maple|soy|mirin|fish sauce|oyster|hoisin|ketchup|mustard/.test(n)) return 'Pantry Staples';
      if (/canned|jar|tin|can/.test(n)) return 'Canned & Jarred';
      if (/cheese|milk|cream|yoghurt|butter/.test(n)) return 'Dairy & Eggs';
      return 'Other';
    }

    function isPantryCategory(name) {
      const cat = categorizeIngredient(name);
      return cat === 'Pantry Staples' || cat === 'Canned & Jarred' || cat === 'Dairy & Eggs';
    }

    // ========== BACKEND SYNC ==========
    async function pushToServer() {
      if (!store.meals.length) return;
      const payload = {};
      DAYS.forEach(d => { if (store.selectedMeals[d]) payload[d] = store.selectedMeals[d].ID; });
      try { await fetch(`${API_BASE}/api/plan`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ plan: payload, lastModified: Date.now() }) }); } catch(e) {}
    }

    async function pushDatabaseToServer() {
      if (!store.meals.length) return;
      const payload = { meals: store.meals, ingredients: store.ingredientsMap, methods: store.methodsMap, lastModified: Date.now() };
      try {
        const res = await fetch(`${API_BASE}/api/database`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        const data = await res.json();
        if (!data.success) { console.warn('Database push rejected:', data.message); }
      } catch(e) { console.error('Database push failed:', e); }
    }

    async function pushDatabaseIfNeeded() { if (store.meals.length) { await pushDatabaseToServer(); } }

    async function pullFromServer() {
      if (!store.meals.length) return;
      try {
        const res = await fetch(`${API_BASE}/api/plan`);
        const data = await res.json();
        if (data && data.plan) {
          if (Date.now() - data.lastModified > FIVE_DAYS_MS) { store.clearWeek(); return; }
          const newPlan = {};
          DAYS.forEach(day => { const meal = store.meals.find(m => m.ID == data.plan[day]); if (meal) newPlan[day] = meal; });
          store.selectedMeals = newPlan;
          store.emit();
        }
      } catch(e) {}
    }

    async function pullDatabaseFromServer() {
      try {
        const res = await fetch(`${API_BASE}/api/database?_=${Date.now()}`, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' } });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const db = await res.json();
        if (db && db.meals && db.meals.length) {
          store.setMeals(db.meals);
          store.setIngredientsMap(db.ingredients || {});
          store.setMethodsMap(db.methods || {});
          return true;
        } else { console.warn('Database pull returned empty meals'); return false; }
      } catch(e) { console.error('Database pull failed:', e); return false; }
    }

    // ========== LOCAL STORAGE ==========
    function saveLocalData() {
      if (store.meals.length) {
        localStorage.setItem('prepify_meals', JSON.stringify(store.meals));
        localStorage.setItem('prepify_ingredients', JSON.stringify(store.ingredientsMap));
        localStorage.setItem('prepify_methods', JSON.stringify(store.methodsMap));
      }
      const sel = {}; DAYS.forEach(d => { if (store.selectedMeals[d]) sel[d] = store.selectedMeals[d].ID; });
      localStorage.setItem('prepify_selections', JSON.stringify({ selectedMeals: sel, lastModified: Date.now() }));
      localStorage.setItem('prepify_shopping', JSON.stringify(store.shoppingChecked));
    }

    function loadLocalData() {
      const mealsStr = localStorage.getItem('prepify_meals');
      if (mealsStr) {
        store.meals = JSON.parse(mealsStr);
        store.ingredientsMap = JSON.parse(localStorage.getItem('prepify_ingredients') || '{}');
        store.methodsMap = JSON.parse(localStorage.getItem('prepify_methods') || '{}');
        store.shoppingChecked = JSON.parse(localStorage.getItem('prepify_shopping') || '{}');
      }
      const selStr = localStorage.getItem('prepify_selections');
      if (selStr && store.meals.length) {
        try {
          const data = JSON.parse(selStr);
          if (Date.now() - data.lastModified > FIVE_DAYS_MS) store.clearWeek();
          else Object.entries(data.selectedMeals||{}).forEach(([day, id]) => {
            const meal = store.meals.find(m => m.ID == id);
            if (meal) store.selectedMeals[day] = meal;
          });
        } catch(e) {}
      }
    }

    // ========== EXCEL PARSING ==========
    function parseWorkbook(wb) {
      const sheet = wb.SheetNames.find(n => n.toLowerCase().includes('meal')) || wb.SheetNames[0];
      const meals = XLSX.utils.sheet_to_json(wb.Sheets[sheet]).map(r => ({
        ID: r.ID, 'Meal Name': r['Meal Name'], Category: r.Category, Cuisine: r.Cuisine,
        'Prep Time (min)': parseInt(r['Prep Time (min)']||15), 'Cook Time (min)': parseInt(r['Cook Time (min)']||20),
        Servings: parseInt(r.Servings||4), 'Cal/Serve': parseInt(r['Cal/Serve']||450),
        'Protein (g)': parseInt(r['Protein (g)']||30), 'Carbs (g)': parseInt(r['Carbs (g)']||55),
        'Fat (g)': parseInt(r['Fat (g)']||12), Allergens: r.Allergens||'', Difficulty: r.Difficulty||'Easy',
        'Fridge Storage (days)': parseInt(r['Fridge Storage (days)']||4), 'Meal Prep Notes': r['Meal Prep Notes']||'',
        'Carb Source': r['Carb Source']||'', 'Protein Source': r['Protein Source']||'', Vegetables: r.Vegetables||''
      }));
      store.setMeals(meals);

      const ingSheet = wb.SheetNames.find(n => n.toLowerCase().includes('ingredient'));
      if (ingSheet) {
        const ingMap = {};
        XLSX.utils.sheet_to_json(wb.Sheets[ingSheet]).forEach(r => {
          const id = r['Meal ID']; if (!id) return;
          if (!ingMap[id]) ingMap[id] = [];
          ingMap[id].push({ name: r['Ingredient'], quantity: parseFloat(r['Quantity']), unit: r['Unit'] });
        });
        store.setIngredientsMap(ingMap);
      }

      const methSheet = wb.SheetNames.find(n => n.toLowerCase().includes('method'));
      if (methSheet) {
        const methMap = {};
        XLSX.utils.sheet_to_json(wb.Sheets[methSheet]).forEach(r => {
          if (r['Meal ID'] && r['Method (4 servings)']) methMap[r['Meal ID']] = r['Method (4 servings)'];
        });
        store.setMethodsMap(methMap);
      }

      pushDatabaseToServer();
    }

    // ========== FILE UPLOAD ==========
    window.handleFileUpload = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
          parseWorkbook(wb);
          store.clearWeek();
          refreshUI();
        } catch (err) { alert('Parse error: ' + err.message); }
      };
      reader.readAsArrayBuffer(file);
      e.target.value = '';
    };

    // ========== MODALS ==========
    function openMealDetail(meal) {
      const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
      overlay.innerHTML = `<div class="modal-content p-6 relative">
        <button class="absolute top-3 right-3 text-gray-400 text-xl">&times;</button>
        <h2 class="font-display text-2xl font-semibold">${meal['Meal Name']}</h2>
        <p class="text-sm text-gray-500">${meal.Cuisine} · ${meal.Difficulty} · Serves ${meal.Servings}</p>
        <div class="grid grid-cols-4 gap-2 my-3">
          <div class="bg-gray-50 p-2 rounded-xl text-center"><span class="text-xs">Cal</span><span class="block font-bold">${meal['Cal/Serve']}</span></div>
          <div class="bg-gray-50 p-2 rounded-xl text-center"><span class="text-xs">Protein</span><span class="block font-bold">${meal['Protein (g)']}g</span></div>
          <div class="bg-gray-50 p-2 rounded-xl text-center"><span class="text-xs">Carbs</span><span class="block font-bold">${meal['Carbs (g)']}g</span></div>
          <div class="bg-gray-50 p-2 rounded-xl text-center"><span class="text-xs">Fat</span><span class="block font-bold">${meal['Fat (g)']}g</span></div>
        </div>
        <p class="text-sm">⏱ Prep ${meal['Prep Time (min)']}m + Cook ${meal['Cook Time (min)']}m · ❄️ Fridge ${meal['Fridge Storage (days)']}d</p>
        ${meal.Allergens ? `<p class="text-red-500">⚠️ ${meal.Allergens}</p>` : ''}
        ${meal['Meal Prep Notes'] ? `<p class="italic mt-2">💡 ${meal['Meal Prep Notes']}</p>` : ''}
      </div>`;
      overlay.querySelector('button').onclick = () => overlay.remove();
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
    }

    function openDayPicker(meal) {
      const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
      const modal = document.createElement('div'); modal.className = 'modal-content p-6';
      modal.innerHTML = `<h3 class="font-display text-xl font-semibold mb-3">Add "${meal['Meal Name']}"</h3>`;
      DAYS.forEach(day => {
        const exist = store.selectedMeals[day];
        const btn = document.createElement('button');
        btn.className = 'w-full py-2.5 px-4 rounded-xl text-left hover:bg-gray-50 border mb-2 flex justify-between';
        btn.innerHTML = `<span>${day} ${exist ? `<span class="text-gray-400 text-xs">(replaces ${exist['Meal Name']})</span>` : ''}</span><span class="text-green-700">+ Add</span>`;
        btn.onclick = () => { store.selectMeal(day, meal); overlay.remove(); refreshUI(); };
        modal.appendChild(btn);
      });
      const cancel = document.createElement('button'); cancel.className = 'w-full py-2 text-gray-500'; cancel.textContent = 'Cancel';
      cancel.onclick = () => overlay.remove();
      modal.appendChild(cancel);
      overlay.appendChild(modal);
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
    }

    // ========== RENDER ==========
    function refreshUI() { renderApp(); }

    function renderApp() {
      const app = document.getElementById('app'); app.innerHTML = '';
      const container = document.createElement('div'); container.className = 'max-w-6xl mx-auto px-4 py-6';

      const header = document.createElement('header');
      header.className = 'flex flex-wrap items-center justify-between gap-3 mb-6';
      header.innerHTML = `
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-[#C17A5C] to-[#E8A849] flex items-center justify-center text-white font-bold text-lg">P</div>
          <div><h1 class="font-display text-2xl font-bold">Prepify</h1><p class="text-xs text-gray-500 uppercase tracking-wider">Synced Meal Prep</p></div>
        </div>`;
      const fileInput = document.createElement('input');
      fileInput.type = 'file'; fileInput.accept = '.xlsx,.xls'; fileInput.id = 'fileInputVisible'; fileInput.style.display = 'none';
      fileInput.addEventListener('change', window.handleFileUpload);
      const uploadLabel = document.createElement('label');
      uploadLabel.setAttribute('for', 'fileInputVisible');
      uploadLabel.className = 'px-4 py-2.5 rounded-xl border border-dashed border-gray-300 bg-white/80 hover:bg-orange-50 text-sm font-medium cursor-pointer';
      uploadLabel.textContent = '📤 Upload Excel';
      header.appendChild(fileInput);
      header.appendChild(uploadLabel);

      const syncBtn = document.createElement('button');
      syncBtn.className = 'px-4 py-2.5 rounded-xl bg-blue-500 text-white text-sm font-medium hover:bg-blue-600 transition ml-2';
      syncBtn.textContent = '🔄 Sync';
      syncBtn.onclick = async function() {
        syncBtn.textContent = '⏳ Syncing...';
        syncBtn.disabled = true;
        if (store.meals.length) { await pushDatabaseToServer(); }
        const dbOk = await pullDatabaseFromServer();
        if (store.meals.length) { await pullFromServer(); }
        refreshUI();
        syncBtn.textContent = dbOk || store.meals.length ? '✅ Synced' : '❌ Failed';
        setTimeout(() => { syncBtn.textContent = '🔄 Sync'; syncBtn.disabled = false; }, 2000);
      };
      header.appendChild(syncBtn);

      const hardSyncBtn = document.createElement('button');
      hardSyncBtn.className = 'px-4 py-2.5 rounded-xl bg-red-500 text-white text-sm font-medium hover:bg-red-600 transition ml-2';
      hardSyncBtn.textContent = '🗑 Hard Sync';
      hardSyncBtn.onclick = async function() {
        if (!confirm('Clear local cache and re‑pull from server?')) return;
        localStorage.removeItem('prepify_meals'); localStorage.removeItem('prepify_ingredients'); localStorage.removeItem('prepify_methods');
        store.meals = []; store.ingredientsMap = {}; store.methodsMap = {};
        refreshUI();
        const dbOk = await pullDatabaseFromServer();
        if (dbOk) { await pullFromServer(); refreshUI(); alert('Hard sync complete!'); }
        else { alert('Failed to pull database.'); }
      };
      header.appendChild(hardSyncBtn);
      container.appendChild(header);

      if (!store.meals.length) {
        const empty = document.createElement('div'); empty.className = 'text-center py-20';
        empty.innerHTML = `<h2 class="font-display text-2xl font-semibold mb-2">No meal database loaded</h2><p class="text-gray-500">Upload your Excel, or tap <strong>🔄 Sync</strong> to pull the database from the server.</p>`;
        container.appendChild(empty);
        app.appendChild(container);
        return;
      }

      const tabs = document.createElement('div'); tabs.className = 'flex gap-2 bg-gray-100/80 p-1.5 rounded-2xl w-fit mb-6';
      ['planner','shopping','methods','chef'].forEach(t => {
        const btn = document.createElement('button'); btn.className = `tab-btn ${store.activeTab === t ? 'active' : ''}`;
        btn.textContent = t === 'planner' ? '📅 Planner' : t === 'shopping' ? '🛒 Shopping' : t === 'methods' ? '👨‍🍳 Methods' : '👨‍🍳 Chef';
        btn.onclick = () => { store.setActiveTab(t); refreshUI(); };
        tabs.appendChild(btn);
      });
      container.appendChild(tabs);

      if (store.activeTab === 'planner') renderPlanner(container);
      else if (store.activeTab === 'shopping') renderShopping(container);
      else if (store.activeTab === 'methods') renderMethods(container);
      else if (store.activeTab === 'chef') renderChefTab(container);

      app.appendChild(container);
    }

    // ========== PLANNER TAB ==========
    function renderPlanner(container) {
      const sec = document.createElement('div');
      sec.innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-display text-2xl font-semibold">5-Day Planner</h2>
          <div class="flex gap-2">
            <button id="autoBtn" class="px-4 py-2 bg-[#C17A5C] text-white rounded-xl text-sm font-semibold">✨ Auto‑fill</button>
            <button id="clearBtn" class="px-4 py-2 border border-gray-200 rounded-xl text-sm">Clear</button>
          </div>
        </div>`;
      const grid = document.createElement('div'); grid.className = 'grid grid-cols-2 md:grid-cols-5 gap-4 mb-8';
      DAYS.forEach(day => {
        const meal = store.selectedMeals[day];
        const card = document.createElement('div'); card.className = 'card p-4 cursor-pointer';
        card.innerHTML = `<span class="text-xs font-bold uppercase text-gray-400">${day}</span>`;
        if (meal) {
          card.innerHTML += `<h3 class="font-semibold text-base">${meal['Meal Name']}</h3><div class="flex gap-2 text-xs text-gray-500"><span>${meal.Cuisine}</span><span class="badge ${meal.Difficulty==='Easy'?'diff-easy':'diff-medium'}">${meal.Difficulty}</span></div><div class="grid grid-cols-4 gap-1 text-xs mt-1"><div>🔥${meal['Cal/Serve']}</div><div>💪${meal['Protein (g)']}g</div><div>🍞${meal['Carbs (g)']}g</div><div>🧈${meal['Fat (g)']}g</div></div><button class="text-xs text-red-400 remove-btn">Remove</button>`;
          card.querySelector('.remove-btn').onclick = (e) => { e.stopPropagation(); store.removeMeal(day); refreshUI(); };
          card.onclick = () => openMealDetail(meal);
        } else { card.innerHTML += '<div class="text-gray-300 text-sm text-center py-4">+ Add</div>'; }
        grid.appendChild(card);
      });
      sec.appendChild(grid);
      container.appendChild(sec);
      sec.querySelector('#autoBtn').onclick = () => { store.autoFillWeek(); refreshUI(); };
      sec.querySelector('#clearBtn').onclick = () => { store.clearWeek(); refreshUI(); };

      // ===== BROWSE MEALS (improved cards with clear filters) =====
      const browser = document.createElement('div');
      const filterPanel = document.createElement('div'); filterPanel.id = 'filterPanel'; filterPanel.className = 'card p-4 mb-4 hidden';
      const categories = ['All Categories', ...new Set(store.meals.map(m => m.Category))];
      const cuisines = ['All Cuisines', ...new Set(store.meals.map(m => m.Cuisine))];
      const difficulties = ['Any Difficulty', 'Easy', 'Medium'];
      const proteins = ['All Proteins', ...new Set(store.meals.flatMap(m => (m['Protein Source']||'').split(',').map(s => s.trim()).filter(Boolean)))];
      const selects = {};
      [['catFilter', categories], ['cuisineFilter', cuisines], ['diffFilter', difficulties], ['protFilter', proteins]].forEach(([id, opts]) => {
        const sel = document.createElement('select'); sel.id = id; sel.className = 'border rounded-xl px-3 py-2 text-sm bg-white';
        opts.forEach(o => { const opt = document.createElement('option'); opt.value = o.startsWith('All') || o.startsWith('Any') ? '' : o; opt.textContent = o; sel.appendChild(opt); });
        selects[id] = sel;
      });
      const searchInput = document.createElement('input'); searchInput.type = 'text'; searchInput.placeholder = 'Search meals...'; searchInput.className = 'border rounded-xl px-3 py-2 text-sm'; searchInput.id = 'searchInput';
      const filterGrid = document.createElement('div'); filterGrid.className = 'grid grid-cols-2 md:grid-cols-5 gap-3';
      filterGrid.append(selects['catFilter'], selects['cuisineFilter'], selects['diffFilter'], selects['protFilter'], searchInput);
      filterPanel.appendChild(filterGrid);
      browser.appendChild(filterPanel);

      const filterHeader = document.createElement('div'); filterHeader.className = 'flex justify-between items-center mb-3';
      filterHeader.innerHTML = '<h3 class="font-display text-xl font-semibold">Browse Meals</h3>';
      const filterBtnsWrap = document.createElement('div'); filterBtnsWrap.className = 'flex gap-2';
      const filterToggleBtn = document.createElement('button'); filterToggleBtn.className = 'text-sm border border-gray-200 px-4 py-2 rounded-xl hover:bg-gray-50 transition'; filterToggleBtn.textContent = '🔽 Filters';
      filterToggleBtn.addEventListener('click', () => filterPanel.classList.toggle('hidden'));
      const clearFiltersBtn = document.createElement('button'); clearFiltersBtn.className = 'text-sm border border-gray-200 px-4 py-2 rounded-xl text-red-500 hover:bg-red-50 transition hidden'; clearFiltersBtn.textContent = '✕ Clear Filters';
      clearFiltersBtn.addEventListener('click', () => {
        store.resetFilters();
        Object.values(selects).forEach(s => s.value = '');
        searchInput.value = '';
        updateMealGrid();
        clearFiltersBtn.classList.add('hidden');
      });
      filterBtnsWrap.appendChild(filterToggleBtn);
      filterBtnsWrap.appendChild(clearFiltersBtn);
      filterHeader.appendChild(filterBtnsWrap);
      browser.appendChild(filterHeader);

      const mealGrid = document.createElement('div'); mealGrid.id = 'mealGrid'; mealGrid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 max-h-[600px] overflow-y-auto pr-1';
      browser.appendChild(mealGrid);
      sec.appendChild(browser);
      container.appendChild(sec);

      const updateMealGrid = () => {
        const filtered = store.getFilteredMeals();
        const protVal = selects['protFilter'].value;
        const finalMeals = protVal ? filtered.filter(m => (m['Protein Source']||'').toLowerCase().includes(protVal.toLowerCase())) : filtered;
        mealGrid.innerHTML = finalMeals.length ? '' : '<p class="col-span-full text-center text-gray-400 py-12">No meals match.</p>';
        finalMeals.forEach(meal => {
          const card = document.createElement('div');
          card.className = 'card meal-card cursor-pointer';
          card.innerHTML = `
            <div class="flex items-start justify-between">
              <h4 class="font-semibold text-base leading-snug">${meal['Meal Name']}</h4>
              <span class="badge badge-${meal.Category.toLowerCase().replace(' ','-')} ml-2">${meal.Category}</span>
            </div>
            <div class="meal-meta">
              <span>🌍 ${meal.Cuisine}</span>
              <span>·</span>
              <span class="diff-badge ${meal.Difficulty==='Easy'?'diff-easy':'diff-medium'}">${meal.Difficulty}</span>
              <span>·</span>
              <span>🔥 ${meal['Cal/Serve']} cal</span>
            </div>
            <div class="flex items-center justify-between mt-1">
              <span class="text-xs text-gray-400">⏱ ${meal['Prep Time (min)']+meal['Cook Time (min)']}min</span>
              <button class="add-btn">+ Add</button>
            </div>`;
          card.querySelector('.add-btn').onclick = (e) => { e.stopPropagation(); openDayPicker(meal); };
          card.onclick = () => openMealDetail(meal);
          mealGrid.appendChild(card);
        });
        // Show/hide clear filters button
        const f = store.filters;
        const hasFilters = f.category || f.cuisine || f.difficulty || f.search || protVal;
        clearFiltersBtn.classList.toggle('hidden', !hasFilters);
      };
      updateMealGrid();

      const apply = () => {
        store.setFilters({ category: selects['catFilter'].value, cuisine: selects['cuisineFilter'].value, difficulty: selects['diffFilter'].value });
        updateMealGrid();
      };
      selects['catFilter'].addEventListener('change', apply);
      selects['cuisineFilter'].addEventListener('change', apply);
      selects['diffFilter'].addEventListener('change', apply);
      selects['protFilter'].addEventListener('change', updateMealGrid);
      searchInput.addEventListener('input', (e) => { store.setFilters({ search: e.target.value }); updateMealGrid(); });
    }

    // ========== SHOPPING TAB ==========
    function renderShopping(container) {
      const list = store.getShoppingList();
      const sec = document.createElement('div');
      sec.innerHTML = `<div class="flex justify-between items-center mb-4"><h2 class="font-display text-2xl font-semibold">Shopping List</h2><div class="flex gap-2">${list.length ? `<button id="copyBtn" class="px-3 py-1.5 border rounded-xl text-sm">📋 Copy</button><button id="pdfBtn" class="px-3 py-1.5 bg-gray-800 text-white rounded-xl text-sm">PDF</button>` : ''}</div></div>`;
      const content = document.createElement('div'); content.className = 'card p-5';
      if (!list.length) content.innerHTML = '<p class="text-gray-400 text-center py-12">Select meals first. Pantry items are automatically hidden.</p>';
      else {
        const grouped = {}; list.forEach(i => { if (!grouped[i.category]) grouped[i.category] = []; grouped[i.category].push(i); });
        Object.entries(grouped).forEach(([cat, items]) => {
          const div = document.createElement('div'); div.className = 'mb-4';
          div.innerHTML = `<h3 class="text-sm font-semibold text-gray-500 uppercase mb-2">${cat} (${items.length})</h3>`;
          items.forEach(item => {
            const row = document.createElement('div'); row.className = `shopping-item flex items-center gap-3 py-2.5 px-2 rounded-xl cursor-pointer hover:bg-gray-50 ${store.shoppingChecked[item.key] ? 'checked' : ''}`;
            row.innerHTML = `<div class="check-dot w-5 h-5 rounded-full border-2 flex items-center justify-center text-white text-xs font-bold" style="background:${store.shoppingChecked[item.key]?'#8B9D6B':'white'};border-color:${store.shoppingChecked[item.key]?'#8B9D6B':'#d4cfc6'}">${store.shoppingChecked[item.key]?'✓':''}</div><span class="item-text text-sm flex-1 font-medium">${item.name} — ${item.quantity}${item.unit}</span><span class="text-xs text-gray-400 hidden sm:inline">${item.mealRefs.join(', ')}</span>`;
            row.onclick = () => { store.toggleShoppingItem(item.key); refreshUI(); };
            div.appendChild(row);
          });
          content.appendChild(div);
        });
        content.appendChild(Object.assign(document.createElement('div'), { className: 'mt-4 pt-3 border-t border-gray-100 text-sm text-gray-500 flex justify-between', innerHTML: `${list.filter(i=>store.shoppingChecked[i.key]).length}/${list.length} checked` }));
      }
      sec.appendChild(content);
      container.appendChild(sec);
      sec.querySelector('#copyBtn')?.addEventListener('click', () => {
        let t = '🛒 SHOPPING LIST\n\n';
        const g = {}; list.forEach(i => { if(!g[i.category]) g[i.category]=[]; g[i.category].push(i); });
        Object.entries(g).forEach(([c,items]) => { t += `📦 ${c}\n`; items.forEach(i => t += `  ${store.shoppingChecked[i.key]?'☑':'☐'} ${i.name} — ${i.quantity}${i.unit}\n`); });
        navigator.clipboard.writeText(t).then(() => alert('Copied!'));
      });
    }

    // ========== METHODS TAB ==========
    function renderMethods(container) {
      const sec = document.createElement('div');
      sec.innerHTML = '<h2 class="font-display text-2xl font-semibold mb-4">👨‍🍳 Cooking Methods</h2>';
      const grid = document.createElement('div'); grid.className = 'space-y-4';
      let has = false;
      DAYS.forEach(day => {
        const meal = store.selectedMeals[day]; if (!meal) return;
        const method = store.methodsMap[meal.ID]; if (!method) return;
        has = true;
        const card = document.createElement('div'); card.className = 'card p-5';
        card.innerHTML = `<h3 class="font-semibold text-lg">${meal['Meal Name']} <span class="text-sm text-gray-500">(${day})</span></h3><p class="text-sm mt-2 whitespace-pre-line leading-relaxed">${method}</p>`;
        grid.appendChild(card);
      });
      if (!has) grid.innerHTML = '<p class="text-gray-400 text-center py-12">No methods available.</p>';
      sec.appendChild(grid);
      container.appendChild(sec);
    }

    // ========== CHEF TAB ==========
    function renderChefTab(container) {
      const sec = document.createElement('div'); sec.className = 'space-y-6';
      sec.innerHTML = '<h2 class="font-display text-2xl font-semibold">👨‍🍳 Chef\'s Command Center</h2>';
      const selectedMeals = DAYS.map(d => store.selectedMeals[d]).filter(Boolean);
      if (!selectedMeals.length) {
        sec.innerHTML += '<div class="card p-8 text-center"><p class="text-gray-400 text-lg">No meals selected.</p></div>';
        container.appendChild(sec); return;
      }

      // Summary
      const tc = selectedMeals.reduce((s,m)=>s+(m['Cal/Serve']||0),0);
      const tp = selectedMeals.reduce((s,m)=>s+(m['Protein (g)']||0),0);
      const tpr = selectedMeals.reduce((s,m)=>s+(m['Prep Time (min)']||0),0);
      const tco = selectedMeals.reduce((s,m)=>s+(m['Cook Time (min)']||0),0);
      const sum = document.createElement('div'); sum.className = 'card p-5';
      sum.innerHTML = `<h3 class="font-semibold text-lg mb-4">📊 Weekly Summary</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center"><div class="bg-gray-50 rounded-xl p-3"><p class="text-xs text-gray-500">Calories</p><p class="text-2xl font-bold">${tc}</p></div><div class="bg-gray-50 rounded-xl p-3"><p class="text-xs text-gray-500">Protein</p><p class="text-2xl font-bold">${tp}g</p></div><div class="bg-gray-50 rounded-xl p-3"><p class="text-xs text-gray-500">Prep</p><p class="text-2xl font-bold">${tpr}m</p></div><div class="bg-gray-50 rounded-xl p-3"><p class="text-xs text-gray-500">Cook</p><p class="text-2xl font-bold">${tco}m</p></div></div>`;
      sec.appendChild(sum);

      // Batched Prep List
      const prep = document.createElement('div'); prep.className = 'card p-5';
      prep.innerHTML = '<h3 class="font-semibold text-lg mb-4">🔪 Batched Prep List</h3>';
      const allIng = [];
      selectedMeals.forEach(meal => {
        const ingData = store.ingredientsMap[meal.ID];
        if (ingData) ingData.forEach(i => allIng.push({ ...i, mealName: meal['Meal Name'] }));
      });
      const batched = {};
      allIng.forEach(i => {
        const k = i.name.toLowerCase().replace(/[^a-z0-9]/g,'_');
        if (!batched[k]) batched[k] = { name: i.name, totalQty: 0, unit: i.unit, meals: [] };
        batched[k].totalQty += i.quantity||0;
        if (!batched[k].meals.find(m=>m.name===i.mealName)) batched[k].meals.push({ name: i.mealName });
      });
      const sorted = Object.values(batched).sort((a,b)=>a.name.localeCompare(b.name));
      const bGrid = document.createElement('div'); bGrid.className = 'space-y-2 max-h-96 overflow-y-auto';
      sorted.forEach(item => {
        const r = document.createElement('div'); r.className = 'flex items-center gap-3 py-2.5 px-3 rounded-xl bg-gray-50';
        r.innerHTML = `<input type="checkbox" class="h-5 w-5 accent-green-700 flex-shrink-0"><div class="flex-1"><p class="font-semibold text-sm">${item.name} <span class="text-gray-500 font-normal text-xs">— ${Math.round(item.totalQty)}${item.unit} total</span></p><p class="text-xs text-gray-400">Used in: ${item.meals.map(m=>m.name).join(', ')}</p></div>`;
        bGrid.appendChild(r);
      });
      prep.appendChild(bGrid);
      sec.appendChild(prep);

      // Auto Pantry
      const pantryCard = document.createElement('div'); pantryCard.className = 'card p-5';
      pantryCard.innerHTML = '<h3 class="font-semibold text-lg mb-4">🧂 Pantry <span class="text-xs text-gray-400 font-normal">(auto‑populated from spreadsheet)</span></h3><p class="text-xs text-gray-400 mb-3">✓ = stocked (won\'t appear in shopping list)</p>';
      
      const allDbIngredients = new Set();
      Object.values(store.ingredientsMap).forEach(ings => ings.forEach(i => allDbIngredients.add(i.name)));
      
      const pantryList = document.createElement('div'); pantryList.className = 'space-y-2 max-h-72 overflow-y-auto';
      [...allDbIngredients].sort().forEach(name => {
        if (!isPantryCategory(name)) return;
        const isStocked = isPantryStocked(name);
        const row = document.createElement('div');
        row.className = `flex items-center gap-3 py-2 px-3 rounded-xl ${isStocked ? 'bg-green-50' : 'bg-red-50'}`;
        row.innerHTML = `
          <input type="checkbox" class="h-5 w-5 accent-green-700 pantry-cb" ${isStocked ? 'checked' : ''}>
          <span class="flex-1 text-sm font-medium ${isStocked ? 'text-green-800' : 'text-red-800'}">${name}</span>
          <span class="text-xs text-gray-400">${isStocked ? '✅ Stocked' : '❌ Need to buy'}</span>`;
        row.querySelector('.pantry-cb').addEventListener('change', (e) => {
          if (e.target.checked) { markPantryItem(name); }
          else { unmarkPantryItem(name); }
          row.className = `flex items-center gap-3 py-2 px-3 rounded-xl ${e.target.checked ? 'bg-green-50' : 'bg-red-50'}`;
          row.querySelector('span:first-of-type').className = `flex-1 text-sm font-medium ${e.target.checked ? 'text-green-800' : 'text-red-800'}`;
          row.querySelector('span:last-of-type').textContent = e.target.checked ? '✅ Stocked' : '❌ Need to buy';
          if (store.activeTab === 'shopping') refreshUI();
        });
        pantryList.appendChild(row);
      });
      pantryCard.appendChild(pantryList);
      sec.appendChild(pantryCard);

      // Delivery Tracker
      const track = document.createElement('div'); track.className = 'card p-5';
      track.innerHTML = '<h3 class="font-semibold text-lg mb-4">📦 Delivery Tracker</h3>';
      const tGrid = document.createElement('div'); tGrid.className = 'grid grid-cols-1 md:grid-cols-5 gap-3';
      DAYS.forEach(day => {
        const meal = store.selectedMeals[day];
        const col = document.createElement('div'); col.className = 'border rounded-xl p-3';
        col.innerHTML = `<p class="text-xs font-bold uppercase text-gray-500 mb-2">${day}</p>`;
        if (meal) {
          col.innerHTML += `<p class="font-semibold text-sm">${meal['Meal Name']}</p>`;
          ['Cooked','Packed','Delivered'].forEach(s => col.innerHTML += `<label class="flex items-center gap-2 mt-2 text-xs cursor-pointer"><input type="checkbox" class="accent-green-700 h-4 w-4"> <span>${s}</span></label>`);
        } else col.innerHTML += '<p class="text-gray-300 text-xs">No meal</p>';
        tGrid.appendChild(col);
      });
      track.appendChild(tGrid);
      sec.appendChild(track);

      // Allergens
      const allergens = new Set(selectedMeals.flatMap(m=>(m.Allergens||'').split(',').map(s=>s.trim()).filter(Boolean)));
      if (allergens.size) {
        const aCard = document.createElement('div'); aCard.className = 'card p-5 border-red-200 bg-red-50';
        aCard.innerHTML = `<h3 class="font-semibold text-lg mb-2 text-red-700">⚠️ Allergens</h3><p class="text-sm text-red-600">This week: ${[...allergens].join(', ')}</p>`;
        sec.appendChild(aCard);
      }

      container.appendChild(sec);
    }

    // ========== INIT ==========
    window.addEventListener('DOMContentLoaded', async () => {
      loadLocalData();
      if (!store.meals.length) await pullDatabaseFromServer();
      if (store.meals.length) await pullFromServer();
      store.emit();
      refreshUI();
      setInterval(pullFromServer, 30000);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    });
  </script>
</body>
</html>

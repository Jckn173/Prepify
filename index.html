<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#C17A5C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Prepify">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>Prepify · Synced Meal Prep</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #FEFAF3; color: #3D3A36; margin: 0; -webkit-tap-highlight-color: transparent; }
    .font-display { font-family: 'Playfair Display', Georgia, serif; }
    .card { background: #FFFBF5; border: 1px solid #E8E2D8; border-radius: 20px; box-shadow: 0 4px 18px rgba(61,58,54,0.04); transition: all 0.2s; }
    .card:hover { box-shadow: 0 10px 28px rgba(61,58,54,0.08); transform: translateY(-2px); }
    .tab-btn { padding: 0.5rem 1.25rem; border-radius: 40px; font-weight: 500; font-size: 0.9rem; background: transparent; color: #6B5F52; border: none; cursor: pointer; transition: all 0.2s; min-height: 44px; }
    .tab-btn.active { background: white; color: #C17A5C; box-shadow: 0 2px 12px rgba(0,0,0,0.04); font-weight: 600; }
    .badge { display: inline-flex; padding: 0.2rem 0.8rem; border-radius: 30px; font-size: 0.7rem; font-weight: 600; background: #F5F2ED; color: #5E5548; }
    .badge-pasta { background: #FDE8D0; color: #B8783B; }
    .badge-rice { background: #E0F0E4; color: #5C8A6B; }
    .badge-noodles { background: #FDE8E4; color: #C47A6B; }
    .badge-wrap { background: #E8E4F0; color: #6B5C8A; }
    .diff-easy { background: #E0F0E4; color: #5C8A6B; }
    .diff-medium { background: #FDF3E0; color: #C49A3B; }
    .shopping-item.checked .item-text { text-decoration: line-through; opacity: 0.5; }
    .shopping-item .check-dot { transition: all 0.2s; }
    .shopping-item.checked .check-dot { background: #8B9D6B !important; border-color: #8B9D6B !important; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(40,36,31,0.4); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
    .modal-content { background: white; border-radius: 24px; max-width: 560px; width: 100%; max-height: 85vh; overflow-y: auto; }

    @media (max-width: 768px) {
      .card { padding: 0.75rem; }
      .tab-btn { padding: 0.4rem 0.9rem; font-size: 0.8rem; }
      .week-grid { gap: 0.75rem; }
      .modal-content { margin: 0.5rem; border-radius: 20px; }
      h2.font-display { font-size: 1.5rem; }
      button, label, .tab-btn { min-height: 44px; }
    }

    .meal-card {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      padding: 1.3rem;
      transition: all 0.2s ease;
    }
    .meal-card:hover {
      box-shadow: 0 12px 28px rgba(61,58,54,0.1);
      transform: translateY(-3px);
    }
    .meal-card .meal-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.7rem;
      font-size: 0.85rem;
      color: #5E5548;
    }
    .meal-card .meal-meta .diff-badge {
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .meal-card .add-btn {
      margin-top: auto;
      align-self: flex-start;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.55rem 1.3rem;
      border-radius: 12px;
      background: #8B9D6B;
      color: white;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
    }
    .meal-card .add-btn:hover {
      background: #6d804f;
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="app"></div>

  <script>
    // ⚙️ SET YOUR BACKEND URL
    const API_BASE = 'https://prepify-backend-pmbg.onrender.com';

    const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];
    const FIVE_DAYS_MS = 5 * 24 * 60 * 60 * 1000;
    let adminLoggedIn = false;

    const store = {
      meals: [],
      ingredientsMap: {},
      methodsMap: {},
      selectedMeals: {},
      shoppingChecked: {},
      filters: { category:'', cuisine:'', difficulty:'', maxTime:'', search:'' },
      activeTab: 'planner',
      listeners: new Set(),
      subscribe(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
      emit() { this.listeners.forEach(fn => fn()); saveLocalData(); pushToServer(); pushDatabaseIfNeeded(); },
      setMeals(meals) { this.meals = meals; this.emit(); },
      setIngredientsMap(map) { this.ingredientsMap = map; },
      setMethodsMap(map) { this.methodsMap = map; },
      selectMeal(day, meal) { this.selectedMeals = { ...this.selectedMeals, [day]: meal }; this.emit(); },
      removeMeal(day) { const n = { ...this.selectedMeals }; delete n[day]; this.selectedMeals = n; this.emit(); },
      autoFillWeek() {
        if (!this.meals.length) return;
        const sel = {}; const used = new Set();
        const cats = ['Pasta','Rice Bowl','Noodles','Rice Bowl','Pasta'];
        DAYS.forEach((d,i) => {
          const pool = this.meals.filter(m => m.Category === cats[i] && !used.has(m.ID));
          const pick = pool.length ? pool[Math.floor(Math.random()*pool.length)] : this.meals.find(m => !used.has(m.ID));
          if (pick) { sel[d] = pick; used.add(pick.ID); }
        });
        this.selectedMeals = sel; this.emit();
      },
      clearWeek() { this.selectedMeals = {}; this.emit(); },
      toggleShoppingItem(key) { this.shoppingChecked = { ...this.shoppingChecked, [key]: !this.shoppingChecked[key] }; this.emit(); },
      setFilters(f) { this.filters = { ...this.filters, ...f }; this.emit(); },
      resetFilters() { this.filters = { category:'', cuisine:'', difficulty:'', maxTime:'', search:'' }; this.emit(); },
      setActiveTab(tab) { this.activeTab = tab; this.emit(); },
      getFilteredMeals() {
        let res = [...this.meals]; const f = this.filters;
        if (f.category) res = res.filter(m => m.Category === f.category);
        if (f.cuisine) res = res.filter(m => m.Cuisine === f.cuisine);
        if (f.difficulty) res = res.filter(m => m.Difficulty === f.difficulty);
        if (f.maxTime) res = res.filter(m => (m['Prep Time (min)']+m['Cook Time (min)']) <= parseInt(f.maxTime));
        if (f.search) { const q = f.search.toLowerCase(); res = res.filter(m => m['Meal Name'].toLowerCase().includes(q) || m.Cuisine.toLowerCase().includes(q)); }
        return res;
      },
      getShoppingList() {
        const items = [];
        DAYS.forEach(day => {
          const meal = this.selectedMeals[day]; if (!meal) return;
          const ingData = this.ingredientsMap[meal.ID];
          if (ingData && ingData.length) {
            ingData.forEach(i => items.push({ ...i, mealRef: meal['Meal Name'], category: categorizeIngredient(i.name) }));
          } else {
            const serv = meal.Servings || 4;
            (meal['Carb Source']||'').split(',').forEach(c => c && items.push({ name: c.trim(), quantity: 80*serv, unit: 'g', mealRef: meal['Meal Name'], category: 'Grains' }));
            (meal['Protein Source']||'').split(',').forEach(p => p && items.push({ name: p.trim(), quantity: 150*serv, unit: 'g', mealRef: meal['Meal Name'], category: 'Protein' }));
            (meal.Vegetables||'').split(',').forEach(v => v && items.push({ name: v.trim(), quantity: 50*serv, unit: 'g', mealRef: meal['Meal Name'], category: 'Produce' }));
          }
        });
        const merged = {};
        items.forEach(i => {
          const key = i.name.toLowerCase().replace(/[^a-z0-9]/g,'_');
          if (merged[key]) { merged[key].quantity += i.quantity; if (!merged[key].mealRefs.includes(i.mealRef)) merged[key].mealRefs.push(i.mealRef); }
          else merged[key] = { ...i, key, mealRefs: [i.mealRef], quantity: i.quantity };
        });
        return Object.values(merged).sort((a,b) => a.category?.localeCompare(b.category||''));
      }
    };

    function categorizeIngredient(name) {
      const n = name.toLowerCase();
      if (/pasta|noodle|rice|quinoa|orzo|vermicelli|couscous|tortilla/.test(n)) return 'Grains & Pasta';
      if (/chicken|beef|pork|lamb|salmon|tuna|prawn|tofu|egg|chickpea|bean|lentil/.test(n)) return 'Protein';
      if (/broccoli|spinach|tomato|carrot|onion|garlic|cucumber|pepper|zucchini|lettuce|avocado|mango|lemon|lime/.test(n)) return 'Produce';
      return 'Other';
    }

    // sync functions (unchanged) ...
    async function pushToServer() { /* ... */ }
    async function pushDatabaseToServer() { /* ... */ }
    async function pushDatabaseIfNeeded() { /* ... */ }
    async function pullFromServer() { /* ... */ }
    async function pullDatabaseFromServer() { /* ... */ }
    function saveLocalData() { /* ... */ }
    function loadLocalData() { /* ... */ }
    function parseWorkbook(wb) { /* ... */ }
    window.handleFileUpload = function(e) { /* ... */ };
    function openMealDetail(meal) { /* ... */ }
    function openDayPicker(meal) { /* ... */ }

    function refreshUI() { renderApp(); }

    function renderApp() {
      // ... (header, tabs, etc. – identical to previous complete version)
    }

    // ========== PLANNER TAB (updated filter behaviour) ==========
    function renderPlanner(container) {
      const sec = document.createElement('div');
      sec.innerHTML = `
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-display text-2xl font-semibold">5-Day Planner</h2>
          <div class="flex gap-2">
            <button id="autoBtn" class="px-4 py-2 bg-[#C17A5C] text-white rounded-xl text-sm font-semibold">✨ Auto-fill</button>
            <button id="clearBtn" class="px-4 py-2 border border-gray-200 rounded-xl text-sm">Clear</button>
          </div>
        </div>`;
      // ... day cards grid unchanged ...
      const grid = document.createElement('div'); grid.className = 'grid grid-cols-2 md:grid-cols-5 gap-4 mb-8';
      DAYS.forEach(day => {
        const meal = store.selectedMeals[day];
        // ... card creation unchanged ...
      });
      sec.appendChild(grid);
      container.appendChild(sec);

      sec.querySelector('#autoBtn').onclick = () => { store.autoFillWeek(); refreshUI(); };
      sec.querySelector('#clearBtn').onclick = () => { store.clearWeek(); refreshUI(); };

      // ===== BROWSE MEALS (improved layout & working filters) =====
      const browser = document.createElement('div');
      browser.className = 'mt-8';
      const browseHeader = document.createElement('div');
      browseHeader.className = 'flex flex-wrap items-center justify-between gap-3 mb-4';
      browseHeader.innerHTML = `
        <h3 class="font-display text-2xl font-semibold">Browse Meals</h3>
        <div class="flex gap-2">
          <button id="filterToggle" class="border border-gray-300 px-4 py-2 rounded-xl text-sm font-medium hover:bg-gray-50 transition">
            🔍 Filters
          </button>
          <button id="clearFiltersBtn" class="border border-gray-300 px-3 py-2 rounded-xl text-sm font-medium text-red-500 hover:bg-red-50 transition hidden">
            ✕ Clear
          </button>
        </div>
      `;

      const filterPanel = document.createElement('div');
      filterPanel.id = 'filterPanel';
      filterPanel.className = 'card p-5 mb-5 hidden space-y-4';
      filterPanel.innerHTML = `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Category</label>
            <select id="catFilter" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white">
              <option value="">All</option><option>Pasta</option><option>Rice Bowl</option><option>Noodles</option><option>Wrap</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Cuisine</label>
            <select id="cuisineFilter" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white">
              <option value="">All</option><option>Italian</option><option>Japanese</option><option>Thai</option><option>Mexican</option><option>Mediterranean</option><option>Indian</option><option>Asian Fusion</option><option>Korean</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Difficulty</label>
            <select id="diffFilter" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white">
              <option value="">Any</option><option>Easy</option><option>Medium</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Search</label>
            <input id="searchInput" placeholder="Search meals..." class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm">
          </div>
        </div>
      `;

      const mealGrid = document.createElement('div');
      mealGrid.id = 'mealGrid';
      mealGrid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[600px] overflow-y-auto pr-1';

      // Local update function – rewrites meal cards without full rebuild
      function refreshMealGrid() {
        const filtered = store.getFilteredMeals();
        mealGrid.innerHTML = filtered.length ? '' : '<p class="col-span-full text-center text-gray-400 py-12">No meals match your filters.</p>';
        filtered.forEach(meal => {
          const card = document.createElement('div');
          card.className = 'card meal-card cursor-pointer';
          card.innerHTML = `
            <div class="flex items-start justify-between">
              <h4 class="font-semibold text-base leading-snug">${meal['Meal Name']}</h4>
              <span class="badge badge-${meal.Category.toLowerCase().replace(' ','-')} ml-2">${meal.Category}</span>
            </div>
            <div class="meal-meta">
              <span>🌍 ${meal.Cuisine}</span>
              <span>·</span>
              <span class="diff-badge ${meal.Difficulty==='Easy'?'diff-easy':'diff-medium'}">${meal.Difficulty}</span>
              <span>·</span>
              <span>🔥 ${meal['Cal/Serve']} cal</span>
            </div>
            <div class="flex items-center justify-between mt-1">
              <span class="text-xs text-gray-400">⏱ ${meal['Prep Time (min)']+meal['Cook Time (min)']}min</span>
              <button class="add-btn">+ Add</button>
            </div>`;
          card.querySelector('.add-btn').onclick = (e) => { e.stopPropagation(); openDayPicker(meal); };
          card.onclick = () => openMealDetail(meal);
          mealGrid.appendChild(card);
        });
      }

      // Update filter UI (select values, clear button, panel visibility)
      function syncFilterUI() {
        const f = store.filters;
        document.getElementById('catFilter').value = f.category;
        document.getElementById('cuisineFilter').value = f.cuisine;
        document.getElementById('diffFilter').value = f.difficulty;
        document.getElementById('searchInput').value = f.search;
        const hasFilters = f.category || f.cuisine || f.difficulty || f.search;
        document.getElementById('clearFiltersBtn').classList.toggle('hidden', !hasFilters);
        if (hasFilters) filterPanel.classList.remove('hidden'); // keep panel open while filtering
      }

      // Apply filter change silently (no full re-render), then refresh grid
      function applyFilterChange(newFilter) {
        // Update store without triggering global emit
        Object.assign(store.filters, newFilter);
        // Save locally but don't emit full store – we only want to update the meal grid
        // But we still need to push to server? No, filters are local only.
        // We'll just refresh the grid and sync UI
        syncFilterUI();
        refreshMealGrid();
        // Still need to save local data? Filters aren't persisted beyond session, okay.
      }

      // Initialize UI and grid
      refreshMealGrid();
      syncFilterUI();

      browser.appendChild(browseHeader);
      browser.appendChild(filterPanel);
      browser.appendChild(mealGrid);
      sec.appendChild(browser);
      container.appendChild(sec);

      // Filter panel toggle
      const filterToggleBtn = browseHeader.querySelector('#filterToggle');
      filterToggleBtn.addEventListener('click', () => {
        filterPanel.classList.toggle('hidden');
      });

      // Clear filters
      browseHeader.querySelector('#clearFiltersBtn').addEventListener('click', () => {
        store.resetFilters(); // this will emit full refresh, but we want to avoid that for filter change? We'll keep it simple: reset triggers full refresh, which will rebuild planner with clean filters and panel hidden.
        refreshUI();
      });

      // Filter input events
      document.getElementById('catFilter').addEventListener('change', (e) => applyFilterChange({ category: e.target.value }));
      document.getElementById('cuisineFilter').addEventListener('change', (e) => applyFilterChange({ cuisine: e.target.value }));
      document.getElementById('diffFilter').addEventListener('change', (e) => applyFilterChange({ difficulty: e.target.value }));
      document.getElementById('searchInput').addEventListener('input', (e) => applyFilterChange({ search: e.target.value }));
    }

    // ========== SHOPPING, METHODS, ADMIN unchanged (same as last complete version) ==========
    function renderShopping(container) { /* ... */ }
    function renderMethods(container) { /* ... */ }
    function renderAdminPanel(container) { /* ... */ }

    // ========== INIT ==========
    window.addEventListener('DOMContentLoaded', async () => {
      loadLocalData();
      if (!store.meals.length) { await pullDatabaseFromServer(); }
      if (store.meals.length) { await pullFromServer(); }
      store.emit();
      refreshUI();
      setInterval(pullFromServer, 30000);
      if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
    });
  </script>
</body>
</html>
